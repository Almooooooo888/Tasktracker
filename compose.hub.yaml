services:
  jira-board:
    image: ${TASKBOARD_IMAGE:-almooooooo/taskboard:1.27.8}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18764:18764"
    environment:
      LK_JIRA_BASE_URL: ${LK_JIRA_BASE_URL:-https://jira.example.com}
      LK_JIRA_TLS_SKIP_VERIFY: ${LK_JIRA_TLS_SKIP_VERIFY:-false}
      LK_GITLAB_BASE_URL: ${LK_GITLAB_BASE_URL:-}
      LK_GITLAB_TOKEN: ${LK_GITLAB_TOKEN:-}
      LK_EXCHANGE_DOMAIN: ${LK_EXCHANGE_DOMAIN:-da.gov.ru}
      LK_EXCHANGE_AUTODISCOVER_URL: ${LK_EXCHANGE_AUTODISCOVER_URL:-https://autodiscover.da.gov.ru/autodiscover/autodiscover.xml}
      LK_INSTALL_MODE: docker
      LK_UPDATER_URL: http://docker-updater:18765
      LK_UPDATER_TOKEN_FILE: /updater-state/token
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
    volumes:
      - profile:/data
      - updater-state:/updater-state:ro
      - ./certs:/run/certs:ro
    networks:
      - default
      - updater
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  docker-updater:
    image: almooooooo/taskboard:1.27.8
    command: ["node", "docker-updater.mjs"]
    user: "0:0"
    restart: unless-stopped
    healthcheck:
      disable: true
    environment:
      UPDATER_STATE_DIR: /updater-state
      UPDATER_WORKSPACE: /workspace
      UPDATER_PROJECT: ${TASKBOARD_PROJECT:-}
    volumes:
      - updater-state:/updater-state
      - ./:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - updater
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  profile:
  updater-state:
networks:
  updater:
    internal: true
