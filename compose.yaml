services:
  jira-board:
    image: jira-board:1.21.0
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:18764:18764"
    environment:
      LK_JIRA_BASE_URL: ${LK_JIRA_BASE_URL:-https://jira.example.com}
      LK_JIRA_TLS_SKIP_VERIFY: ${LK_JIRA_TLS_SKIP_VERIFY:-false}
      LK_GITLAB_BASE_URL: ${LK_GITLAB_BASE_URL:-}
      LK_GITLAB_TOKEN: ${LK_GITLAB_TOKEN:-}
      LK_PG_HOST: ${LK_PG_HOST:-}
      LK_PG_USER: ${LK_PG_USER:-}
      LK_PG_PASSWORD: ${LK_PG_PASSWORD:-}
      LK_PG_PORT: ${LK_PG_PORT:-5432}
      LK_DB_INTERNAL: ${LK_DB_INTERNAL:-}
      LK_SCHEMA_INTERNAL: ${LK_SCHEMA_INTERNAL:-}
      LK_DB_EXTERNAL: ${LK_DB_EXTERNAL:-}
      LK_SCHEMA_EXTERNAL: ${LK_SCHEMA_EXTERNAL:-}
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
    volumes:
      - profile:/data
      - ./certs:/run/certs:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  profile:
